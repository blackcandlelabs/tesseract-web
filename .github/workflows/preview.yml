name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'redesign/**'
      - '.github/workflows/preview.yml'

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        working-directory: redesign
        run: |
          npm ci
          npm run build

      - name: Package build
        working-directory: redesign
        run: tar -czf build.tar.gz -C build .

      - name: Deploy preview
        uses: blackcandlelabs/bct-preview-deploy@v1
        with:
          slug: tesseract
          pr-number: ${{ github.event.pull_request.number }}
          build-archive: redesign/build.tar.gz

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = `https://tesseract-pr-${prNumber}.preview.blackcandletech.com`;
            
            const marker = '<!-- preview-url-marker -->';
            const body = `${marker}\n\n🚀 **Preview deployed!**\n\nView at: ${previewUrl}`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const existingComment = comments.find(c => c.body?.includes(marker));
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  teardown:
    if: github.event.action == 'closed'
    runs-on: self-hosted
    steps:
      - name: Teardown preview
        uses: blackcandlelabs/bct-preview-teardown@v1
        with:
          slug: tesseract
          pr-number: ${{ github.event.pull_request.number }}
